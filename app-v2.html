<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VERMUX GRESIK V2</title>
<style>body{font-family:sans-serif;background:#111;color:#fff;margin:0}header{background:#FFD500;color:#000;padding:15px;text-align:center;font-weight:900}button{width:100%;padding:14px;border:0;border-radius:10px;font-weight:900;margin-top:10px}input{width:100%;padding:13px;border-radius:10px;border:0;margin-top:8px;box-sizing:border-box}.card{background:#222;margin:10px;padding:14px;border-radius:12px}</style>
</head><body>
<header>🚗 VERMUX GRESIK V2 - SECURE</header>
<div id="login" class="card">
<h3>🔐 Login Aman</h3>
<input id="hp" placeholder="Nomor HP: 0812xxxx">
<button style="background:#FFD500" onclick="mintaOTP()">KIRIM OTP</button>
<input id="otp" placeholder="OTP: 123456">
<button style="background:#fff" onclick="login()">MASUK</button>
</div>
<div id="app" class="card" style="display:none">
<p>Login: <b id="userHp"></b> <button onclick="logout()" style="background:#ff4444;color:#fff;padding:5px">LOGOUT</button></p>
<h3>📍 Buat Order</h3>
<input id="jemput" placeholder="Jemput: Menganti">
<input id="tujuan" placeholder="Tujuan: Gresik Kota">
<input id="harga" placeholder="Harga: 25000">
<button style="background:#FFD500" onclick="buatOrder()">BUAT ORDER</button>
<div id="list"></div>
</div>
<script>
let user=localStorage.getItem('vermux_token');
if(user){showApp();}
function mintaOTP(){alert('OTP Tes: 123456');}
function login(){let hp=document.getElementById('hp').value;let otp=document.getElementById('otp').value;if(hp.length<10)return alert('Isi HP dulu');if(otp!=='123456')return alert('OTP Salah!');localStorage.setItem('vermux_token',hp);localStorage.setItem('vermux_cancel','0');showApp();}
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('userHp').innerText=localStorage.getItem('vermux_token');tampilOrder();}
function logout(){localStorage.removeItem('vermux_token');location.reload();}
function buatOrder(){let j=document.getElementById('jemput').value;let t=document.getElementById('tujuan').value;let h=document.getElementById('harga').value;if(!j||!t||!h)return alert('Lengkapi dulu!');let o=JSON.parse(localStorage.getItem('vermux_orders')||'[]');o.push({id:Date.now(),jemput:j,tujuan:t,harga:h,status:'MENUNGGU'});localStorage.setItem('vermux_orders',JSON.stringify(o));tampilOrder();}
function tampilOrder(){let o=JSON.parse(localStorage.getItem('vermux_orders')||'[]');let html='';o.forEach(x=>{html+=`<div class="card"><b>${x.jemput} → ${x.tujuan}</b><br>Rp ${x.harga}<br>Status: ${x.status}<br>${x.status==='MENUNGGU'?`<button style="background:#00ff88" onclick="terima(${x.id})">TERIMA (KUNCI)</button>`:`<button style="background:#ff4444;color:#fff" onclick="cobaCancel()">COBA CANCEL</button>`}</div>`;});document.getElementById('list').innerHTML=html||'<p>Belum ada order</p>';}
function terima(id){let o=JSON.parse(localStorage.getItem('vermux_orders')||'[]');o=o.map(x=>x.id===id?{...x,status:'🔒 TERKUNCI - DRIVER OTW'}:x);localStorage.setItem('vermux_orders',JSON.stringify(o));alert('ORDER TERKUNCI! Penumpang TIDAK BISA cancel.');tampilOrder();}
function cobaCancel(){let c=parseInt(localStorage.getItem('vermux_cancel')||'0')+1;localStorage.setItem('vermux_cancel',c);if(c>=3){alert('AKUN KE-BLOCK! 3x cancel.');localStorage.removeItem('vermux_token');location.reload();}else alert(`⛔ DITOLAK! Order terkunci. Peringatan ${c}/3`);}
</script></body></html>
